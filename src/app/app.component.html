<div class="container">
  <div class="">
    <div class="example-container">
      <p-card [style]="{ 'background-color': 'rgb(123, 166, 91)' }">
        <h2>Indices</h2>
        <div class="metablocks">
          <div class="metablocks-item">SBERCCPP</div>
          <div class="metablocks-item">SBERECCY</div>
          <div class="metablocks-item">SBERRBTI</div>
          <div class="metablocks-item">SBERREIT</div>
          <div class="metablocks-item">SBERBPFA</div>
          <div class="metablocks-item">SBERREQA</div>
        </div>
      </p-card>
    </div>
    <p-card
      [styleClass]="'m-t-10'"
      [style]="{ 'background-color': 'rgb(123, 166, 91)' }"
    >
      <h2>Task Library</h2>
      <!-- #6b8aa2 фон active -->
      <p-accordion>
        <p-accordionTab *ngFor="let task of tasks" [header]="task.name">
          <div
            class="metablocks"
            cdkDropList
            [cdkDropListData]="task.boxes"
            cdkDropListSortingDisabled
          >
            <div
              class="metablocks-item"
              *ngFor="let item of task.boxes"
              cdkDrag
              (cdkDragDropped)="drop($event)"
              (cdkDragEntered)="entered($event)"
            >
              {{ item.name }}
              <div class="box border" *cdkDragPreview>
                <div class="box__handle" cdkDragHandle>
                  {{ item.name }}
                </div>
                <div class="box__buttons">
                  <button
                    class="ui-button-raised ui-button-warning"
                    pButton
                    icon="pi pi-pencil"
                  ></button>
                  <button
                    class="ui-button-raised ui-button-success"
                    pButton
                    icon="pi pi-check"
                  ></button>
                  <button
                    class="ui-button-raised"
                    pButton
                    icon="pi pi-play"
                  ></button>
                </div>
                <!-- <div class="gate" [class]="gate.name" *ngFor="let gate of box.gates">
              {{ gate.name }}
            </div> -->
              </div>
            </div>
          </div>
        </p-accordionTab>
      </p-accordion>
    </p-card>
  </div>
  <div class="card m-l-20" style="height: 800px;">
    <div class="canvas-container" (mousewheel)="onScroll($event)">
      <div class="canvas__drag" cdkDrag>
        <div class="canvas" #canvas (click)="onCanvasClick($event)" [style.transform]="'scale(' + scale + ')'">
          <div
            class="box-element box border"
            [ngClass]="{'box_selected': box.selected}"
            *ngFor="let box of boxes"
            cdkDrag
            cdkDragBoundary=".canvas-container"
            [cdkDragFreeDragPosition]="box.position"
            (cdkDragStarted)="handleDragStart($event, box)"
            (click)="selectBox($event, box)"
            (cdkDragMoved)="movedBox($event, box)"
            (cdkDragDropped)="drop($event)"
            (cdkDragEntered)="entered($event)"
          >
            <div class="box__handle" cdkDragHandle>
              {{ box.name }}
            </div>
            <div class="box__buttons">
              <button
                class="ui-button-raised ui-button-warning"
                (click)="editBox(box)"
                pButton
                icon="pi pi-pencil"
              ></button>
              <button
                class="ui-button-raised ui-button-success"
                (click)="applyBox(box)"
                pButton
                icon="pi pi-check"
              ></button>
              <button
                class="ui-button-raised"
                (click)="runBox(box)"
                pButton
                icon="pi pi-play"
              ></button>
            </div>
            <!-- <div class="gate" [class]="gate.name" *ngFor="let gate of box.gates">
              {{ gate.name }}
            </div> -->
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-block-parameters [box]="selectedBox" (connection)="connection()"></app-block-parameters>
</div>
<div class="end-arrow" #endArrow></div>
