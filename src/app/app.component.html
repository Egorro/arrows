<div class="container">
  <div class="library border">
    <div class="example-container">
      <h2>Available items</h2>
      <div class="metablocks">
        <div class="metablocks-item">
          Take a shower
        </div>
        <div class="metablocks-item">
          Check e-mail
        </div>
      </div>
      <h2>Available items</h2>
      <div
        class="metablocks"
        cdkDropList
        [cdkDropListData]="items"
        cdkDropListSortingDisabled
      >
        <div
          class="metablocks-item"
          *ngFor="let item of items"
          cdkDrag
          (cdkDragDropped)="drop($event)"
          (cdkDragEntered)="entered($event)"
        >
          {{ item.name }}
        </div>
      </div>
    </div>
  </div>
  <div class="canvas-container border" (mousewheel)="onScroll($event)">
    <div class="canvas__drag" cdkDrag>
      <div
        class="canvas"
        #canvas
        [style.transform]="'scale(' + scale + ')'"
      >
        <div
          class="box border"
          *ngFor="let box of boxes"
          cdkDrag
          cdkDragBoundary=".canvas-container"
          [cdkDragFreeDragPosition]="box.position"
          (cdkDragStarted)="handleDragStart($event, box)"
          (click)="startArrow($event, box)"
          (cdkDragMoved)="drawArrow($event, box)"
          (cdkDragDropped)="drop($event)"
          (cdkDragEntered)="entered($event)"
        >
          <div class="box__handle" cdkDragHandle>
            {{ box.name }}
          </div>
          <div class="box__buttons">
            <button class="ui-button-raised ui-button-warning" (click)="editBox(box)" pButton icon="pi pi-pencil"></button>
            <button class="ui-button-raised ui-button-success" (click)="applyBox(box)" pButton icon="pi pi-check"></button>
            <button class="ui-button-raised" (click)="runBox(box)" pButton icon="pi pi-play"></button>
          </div>
          <!-- <div class="gate" [class]="gate.name" *ngFor="let gate of box.gates">
            {{ gate.name }}
          </div> -->
        </div>
      </div>
    </div>
  </div>
</div>
<div class="end-arrow" #endArrow></div>
